spring.application.name=laundry-backend

# Profiles: dev (local machine, the default) and prod (deployed). Their files hold the real values and are
# git-ignored; copy application-<profile>.properties.example to start one. Pick prod with SPRING_PROFILES_ACTIVE=prod.
# This file only holds shared defaults; an environment variable named in ${...} always wins.
spring.profiles.default=dev

# DB URL — read from either DB_URL (custom) or SPRING_DATASOURCE_URL (Spring standard).
# This bridges older .env files that used the Spring standard key.
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sslos}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# Retire pooled connections before a DB/proxy/NAT idle timeout can reset them
# (SQLSTATE 08006 "Connection reset"), and probe idle ones periodically.
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=10000
# NFR-12: schema changes only through Flyway; Hibernate only checks the mapping.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# SQL logging — OFF by default to keep production output clean.
# Hibernate shows raw SQL by default; in this app that amplifies the ~80 queries
# observed on startup to ~800+ log lines, drowning real signal. Toggle on with
# SPRING_JPA_SHOW_SQL=true only when debugging ORM queries or measuring DB
# pressure with a SQL trace.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.lock-retry-count=60

# JWT Configuration
# No default: the app refuses to start without a secret (>= 32 bytes, checked by JwtService).
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:sslos-api}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}

# Auth Configuration
app.auth.reset-token-expiration-seconds=${PASSWORD_RESET_TOKEN_EXPIRATION:900}

# First Admin account, created on startup only while no active Admin exists (AdminBootstrap).
# Empty email = off. The dev profile sets a default; in prod set BOOTSTRAP_ADMIN_* explicitly.
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.admin.phone=${BOOTSTRAP_ADMIN_PHONE:+84900000001}

# Scheduler tunables (override only if business latency SLA changes).
# Default values are tuned for low DB pressure (≤ ~100 rows per tick).
app.booking.expiration-enabled=${BOOKING_EXPIRATION_ENABLED:true}
app.booking.expiration-interval-ms=${BOOKING_EXPIRATION_INTERVAL_MS:30000}
# BR-04: a hold lasts 5 minutes.
app.booking.hold-duration-seconds=${BOOKING_HOLD_DURATION_SECONDS:300}
# BR-11: free cancellation of a book-later order until T−60.
app.booking.free-cancellation-before=60m
# BR-05: a book-later order starts at most 48 hours ahead.
app.booking.max-advance=48h

# Payment Gateway Configuration (Options: mock, payos)
app.payment.gateway=${PAYMENT_GATEWAY:payos}

# PayOS Configuration (https://payos.vn)
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payos.base-url=${PAYOS_BASE_URL:https://api.payos.vn}
app.payos.callback-url=${PAYOS_CALLBACK_URL:http://localhost:8080/api/payments/payos/webhook}
app.payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/?payment=return}
app.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/?payment=cancelled}

# CORS Configuration - comma-separated list of allowed origins
# Include customer and management Vite dev-server origins (non-proxied scenarios)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080}

# Email Configuration
app.email.enabled=${EMAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.from=${EMAIL_FROM:noreply@sslos.com}

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Device link: ESP32 boards on the store Wi-Fi, through the local EMQX broker =====
# Everything stays on the store LAN: works with no Internet. Boards are set up on their own access point
# "LaundryOS-Setup-XXXX" (http://192.168.4.1) with the store Wi-Fi and the values under MQTT_DEVICE_*.
# Topics (fixed, see MqttTopics): laundryos/v1/devices/<deviceId>/{presence | up/<channel> | down/<channel>}
app.mqtt.enabled=${MQTT_ENABLED:true}
app.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
# EMQX REST API: the backend manages the broker users (its own, the join account, one per approved board).
app.mqtt.api-url=${MQTT_API_URL:http://127.0.0.1:18083}
app.mqtt.api-key=${MQTT_API_KEY:}
app.mqtt.api-secret=${MQTT_API_SECRET:}
# The backend's own broker user (superuser; the backend creates it through the API).
app.mqtt.username=${MQTT_USERNAME:laundryos-server}
app.mqtt.password=${MQTT_PASSWORD:}
# Empty = a random id per start, so no board can take the backend's broker session over.
app.mqtt.client-id=${MQTT_CLIENT_ID:}
# Link state is re-sent this often; the board treats 30 s without any message as link lost.
app.mqtt.keepalive-ms=${MQTT_KEEPALIVE_MS:10000}
# Shown to the admin for the board's setup page: the store server as the boards reach it on the LAN.
app.mqtt.device-host=${MQTT_DEVICE_HOST:}
# The boards connect over TLS (the backend uses plain MQTT on the broker's local port above).
app.mqtt.device-port=${MQTT_DEVICE_PORT:8883}
# This API as the boards reach it on the LAN: they register on it (POST /api/devices/register) for their own MQTT account.
app.mqtt.device-api-port=${MQTT_DEVICE_API_PORT:8080}

# ===== Device commissioning (HELLO → admin approves → owner pairs → self-test → commission) =====
app.iot.self-test-button-timeout-seconds=${IOT_SELF_TEST_BUTTON_TIMEOUT_SECONDS:20}

# ===== Machine / IoT Settings =====
# How long (seconds) without a heartbeat before a machine is marked OFFLINE
app.machine.heartbeat-timeout-seconds=${MACHINE_HEARTBEAT_TIMEOUT_SECONDS:30}
# How long (seconds) to wait for a command ACK before marking it TIMEOUT
app.machine.command-timeout-seconds=${MACHINE_COMMAND_TIMEOUT_SECONDS:15}
# Scheduler tunables for the IoT batch jobs.
# Defaults keep DB pressure low while honoring the configured timeouts.
app.machine.offline-detector-interval-ms=${MACHINE_OFFLINE_INTERVAL_MS:10000}
app.machine.offline-detector-batch=${MACHINE_OFFLINE_BATCH:50}
app.machine.command-timeout-interval-ms=${MACHINE_CMD_TIMEOUT_INTERVAL_MS:5000}
app.machine.command-timeout-batch=${MACHINE_CMD_TIMEOUT_BATCH:100}
# Base URL for generating static machine QR codes (no trailing slash).
# Example: https://sslos.example.com or http://192.168.1.100:3000
app.machine.qr-base-url=${QR_BASE_URL:}

# ===== Start-authorization (QR check-in + physical START) ==========
# Lifetime of a START authorization, in seconds. Default 120 s.
app.machine.start-authorization.ttl-seconds=${START_AUTH_TTL_SECONDS:120}
# How often the expiry sweeper runs. Default 5 s.
app.machine.start-authorization.sweep-millis=${START_AUTH_SWEEP_MS:5000}

# Evidence files (V50 attachments): withdrawal proofs and refund evidence. Local disk by default;
# mount a volume at this path in Docker so files survive restarts.
app.storage.local-dir=${STORAGE_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
