spring.application.name=laundry-backend

# DB URL — read from either DB_URL (custom) or SPRING_DATASOURCE_URL (Spring standard).
# This bridges older .env files that used the Spring standard key.
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sslos}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SQL logging — OFF by default to keep production output clean.
# Hibernate shows raw SQL by default; in this app that amplifies the ~80 queries
# observed on startup to ~800+ log lines, drowning real signal. Toggle on with
# SPRING_JPA_SHOW_SQL=true only when debugging ORM queries or measuring DB
# pressure with a SQL trace. The dev profile (application-dev.properties) turns
# it on automatically.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=false
spring.flyway.lock-retry-count=60

# JWT Configuration
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
app.jwt.issuer=${JWT_ISSUER:sslos-api}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}

# Auth Configuration
app.auth.reset-token-expiration-seconds=${PASSWORD_RESET_TOKEN_EXPIRATION:900}

# Transaction Configuration
app.transaction.expiration-minutes=${TRANSACTION_EXPIRATION_MINUTES:15}
# Scheduler tunables (override only if business latency SLA changes).
# Default values are tuned for low DB pressure (≤ ~100 rows per tick).
app.transaction.expiration-interval-ms=${TX_EXPIRATION_INTERVAL_MS:60000}
app.transaction.expiration-batch=${TX_EXPIRATION_BATCH:100}
app.qr.expiration-interval-ms=${QR_EXPIRATION_INTERVAL_MS:60000}

# Payment Gateway Configuration (Options: mock, payos)
app.payment.gateway=${PAYMENT_GATEWAY:payos}

# PayOS Configuration (https://payos.vn)
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payos.base-url=${PAYOS_BASE_URL:https://api.payos.vn}
app.payos.callback-url=${PAYOS_CALLBACK_URL:http://localhost:8080/api/payments/payos/webhook}

# CORS Configuration - comma-separated list of allowed origins
# Include 5173 for Vite dev server direct access (non-proxied scenarios)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# Email Configuration
app.email.enabled=${EMAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.from=${EMAIL_FROM:noreply@sslos.com}

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== MQTT Configuration (EMQX Cloud, MQTT over TLS) =====
# All credentials MUST come from environment variables — never hardcode.
app.mqtt.broker-host=${MQTT_BROKER_HOST:localhost}
app.mqtt.broker-port=${MQTT_BROKER_PORT:8883}
app.mqtt.username=${MQTT_USERNAME:}
app.mqtt.password=${MQTT_PASSWORD:}
app.mqtt.client-id=${MQTT_CLIENT_ID:sslos-backend-001}
# Whether to use TLS (set to false only for local non-TLS broker testing)
app.mqtt.use-tls=${MQTT_USE_TLS:true}
app.mqtt.connection-timeout-seconds=${MQTT_CONNECTION_TIMEOUT_SECONDS:30}
app.mqtt.keep-alive-interval-seconds=${MQTT_KEEP_ALIVE_SECONDS:60}
app.mqtt.clean-session=${MQTT_CLEAN_SESSION:true}
# QoS for command publishing (1 = at least once; good balance for commands)
app.mqtt.command-qos=${MQTT_COMMAND_QOS:1}

# ===== Machine / IoT Settings =====
# How long (seconds) without a heartbeat before a machine is marked OFFLINE
app.machine.heartbeat-timeout-seconds=${MACHINE_HEARTBEAT_TIMEOUT_SECONDS:30}
# How long (seconds) to wait for a command ACK before marking it TIMEOUT
app.machine.command-timeout-seconds=${MACHINE_COMMAND_TIMEOUT_SECONDS:15}
# Scheduler tunables for the IoT batch jobs.
# Defaults keep DB pressure low while honoring the configured timeouts.
app.machine.offline-detector-interval-ms=${MACHINE_OFFLINE_INTERVAL_MS:10000}
app.machine.offline-detector-batch=${MACHINE_OFFLINE_BATCH:50}
app.machine.command-timeout-interval-ms=${MACHINE_CMD_TIMEOUT_INTERVAL_MS:5000}
app.machine.command-timeout-batch=${MACHINE_CMD_TIMEOUT_BATCH:100}
# Base URL for generating static machine QR codes (no trailing slash).
# Example: https://sslos.example.com or http://192.168.1.100:3000
app.machine.qr-base-url=${QR_BASE_URL:}

# ===== Start-authorization (QR check-in + physical START) ==========
# Lifetime of a START authorization, in seconds. Default 120 s.
app.machine.start-authorization.ttl-seconds=${START_AUTH_TTL_SECONDS:120}
# How often the expiry sweeper runs. Default 5 s.
app.machine.start-authorization.sweep-millis=${START_AUTH_SWEEP_MS:5000}
