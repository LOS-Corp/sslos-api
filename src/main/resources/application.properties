spring.application.name=sslos-api

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sslos}
spring.datasource.username=${DB_USERNAME:sslos}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson 3: trường kiểu nguyên thủy bị thiếu trong JSON lấy giá trị mặc định (false / 0) thay vì báo lỗi
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ---- JWT / auth ----
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
app.jwt.issuer=${JWT_ISSUER:sslos-api}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}
app.auth.reset-token-expiration-seconds=${PASSWORD_RESET_TOKEN_EXPIRATION:900}
app.auth.reset-url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}

# Tài khoản quản trị tạo lần đầu (để trống = không tạo)
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-phone=${BOOTSTRAP_ADMIN_PHONE:+84900000000}
app.bootstrap.admin-roles=${BOOTSTRAP_ADMIN_ROLES:ADMIN,OWNER}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---- MQTT (EMQX của cửa hàng) ----
app.mqtt.enabled=${MQTT_ENABLED:true}
app.mqtt.host=${MQTT_HOST:localhost}
app.mqtt.port=${MQTT_PORT:1883}
app.mqtt.username=${MQTT_BACKEND_USERNAME:sslos-backend}
app.mqtt.password=${MQTT_BACKEND_PASSWORD:}
app.mqtt.device-tls-port=${MQTT_DEVICE_TLS_PORT:8883}
app.mqtt.keepalive-ms=10000
# 1 = phút thật; >1 chạy chu kỳ nhanh để demo (bo chia thời gian chương trình cho số này)
app.mqtt.time-divisor=${DEVICE_TIME_DIVISOR:1}
# Self-test lắp đặt: số giây bo chờ kỹ thuật viên bấm START (firmware giới hạn 5-120).
app.deployment.self-test-button-seconds=${SELF_TEST_BUTTON_SECONDS:60}

# ---- payOS ----
app.payos.base-url=${PAYOS_BASE_URL:https://api-merchant.payos.vn}
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment/return}
app.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}
# Chưa có khóa payOS: bật cổng giả lập POST /api/dev/payments/{intentId}/simulate để test
app.payment.simulation-enabled=${PAYMENT_SIMULATION_ENABLED:false}
# Cổng nhận chuyển khoản: payos (mặc định) hoặc sepay
app.payment.gateway=${PAYMENT_GATEWAY:payos}

# ---- Cổng thanh toán SePay (PAYMENT_GATEWAY=sepay) ----
# sandbox | production; mỗi môi trường có Merchant ID / Secret Key riêng (my.sepay.vn → Cổng thanh toán)
app.sepay.env=${SEPAY_ENV:sandbox}
app.sepay.merchant-id=${SEPAY_MERCHANT_ID:}
app.sepay.secret-key=${SEPAY_SECRET_KEY:}
# Khóa đặt ở Cổng thanh toán → Cấu hình → IPN (xác thực SECRET_KEY, header X-Secret-Key)
app.sepay.ipn-secret-key=${SEPAY_IPN_SECRET_KEY:}
# Địa chỉ backend mà trình duyệt / điện thoại khách mở được (kiosk: địa chỉ LAN của máy chủ)
app.sepay.public-base-url=${SEPAY_PUBLIC_BASE_URL:http://localhost:8080}
app.sepay.success-url=${SEPAY_SUCCESS_URL:http://localhost:5173/payment/return}
app.sepay.error-url=${SEPAY_ERROR_URL:http://localhost:5173/payment/cancel}
app.sepay.cancel-url=${SEPAY_CANCEL_URL:http://localhost:5173/payment/cancel}

# ---- Email ----
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:noreply@sslos.com}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# ---- Jobs ----
app.jobs.enabled=${JOBS_ENABLED:true}

# ---- OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
