spring.application.name=laundry-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sslos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
app.jwt.issuer=${JWT_ISSUER:sslos-api}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
