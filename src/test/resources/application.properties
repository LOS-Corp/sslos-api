spring.application.name=laundry-backend-test

# DataSource comes from the PostgreSQL Testcontainer (@ServiceConnection).
# Schema is built only by Flyway and validated by Hibernate, exactly like production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

app.jwt.secret=this-is-a-development-only-secret-of-32-bytes-aaaaaa
app.jwt.issuer=sslos-api-test
app.jwt.expiration-seconds=900
app.jwt.refresh-token-expiration-seconds=604800

# DeviceLink is mocked in every integration test and no serial port is opened.
app.serial.enabled=false

app.payment.gateway=mock

# Short TTL so the expiry-sweep test finishes in milliseconds.
app.machine.start-authorization.ttl-seconds=2
app.machine.start-authorization.sweep-millis=500
app.booking.expiration-enabled=false

app.cors.allowed-origins=http://localhost:5173

# Evidence files written by tests go to the temp dir, never into the project.
app.storage.local-dir=${java.io.tmpdir}/sslos-test-uploads
