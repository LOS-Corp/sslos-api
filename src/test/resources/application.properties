spring.datasource.url=jdbc:h2:mem:sslos-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.open-in-view=false
app.jwt.secret=test-secret-that-is-at-least-32-characters-long
app.jwt.issuer=sslos-test
app.jwt.expiration-seconds=3600
app.jwt.refresh-token-expiration-seconds=604800
app.auth.reset-token-expiration-seconds=900
app.cors.allowed-origins=http://localhost:3000
app.email.enabled=false
# Mock mail sender for tests
spring.mail.host=localhost
spring.mail.port=25