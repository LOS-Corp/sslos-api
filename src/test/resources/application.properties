spring.application.name=laundry-backend-test

# Use an in-process H2 — keeps the test classpath light and avoids
# needing a live PostgreSQL just to verify the start-authorization
# authorization state-machine.
spring.datasource.url=jdbc:h2:mem:sslos-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=false

app.jwt.secret=this-is-a-development-only-secret-of-32-bytes-aaaaaa
app.jwt.issuer=sslos-api-test
app.jwt.expiration-seconds=900
app.jwt.refresh-token-expiration-seconds=604800

# Skip MQTT — all unit tests mock MqttPublisher anyway.
app.mqtt.broker-host=localhost
app.mqtt.broker-port=1883
app.mqtt.username=
app.mqtt.password=
app.mqtt.use-tls=false
app.mqtt.command-qos=1

# Short TTL so the expiry-sweep test finishes in milliseconds.
app.machine.start-authorization.ttl-seconds=2
app.machine.start-authorization.sweep-millis=500

app.cors.allowed-origins=http://localhost:5173
