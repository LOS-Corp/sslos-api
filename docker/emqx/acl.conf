%% Phân quyền topic cho bo mạch (cùng tên topic với sslos-iot/common/NetLink.h).
%% Backend là superuser (mqtt_accounts.is_superuser) nên không đi qua các luật này.
%% ${username} là deviceId đã xác thực; EMQX bắt client id = username (xem emqx.conf).

{allow, all, publish,   ["laundryos/v1/devices/${username}/presence"]}.
{allow, all, publish,   ["laundryos/v1/devices/${username}/up/#"]}.
{allow, all, subscribe, ["laundryos/v1/devices/${username}/down/#"]}.

{deny, all}.
