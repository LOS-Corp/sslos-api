## EMQX của cửa hàng LaundryOS.
## Giá trị bí mật KHÔNG ghi ở đây: docker-compose.yml ghi đè bằng biến EMQX_<ĐƯỜNG_DẪN> lấy từ .env
##   EMQX_NODE__COOKIE, EMQX_AUTHENTICATION__1__SERVER / __DATABASE / __PASSWORD.

node {
  name = "emqx@127.0.0.1"
  cookie = "set-by-env"
  data_dir = "data"
}

cluster {
  name = sslos
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 18083
}

## Backend nối vào cổng thường trong mạng docker; bo mạch nối qua TLS 8883 (NetLink.h).
listeners.tcp.default {
  bind = "0.0.0.0:1883"
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    certfile = "/opt/emqx/etc/certs/store/cert.pem"
    keyfile = "/opt/emqx/etc/certs/store/key.pem"
    verify = verify_none
  }
}

listeners.ws.default.enable = false
listeners.wss.default.enable = false

## Xác thực: bảng mqtt_accounts (V1__init_schema.sql), role DB chỉ được đọc bảng đó.
## Bo phải dùng client id = username, để một bo không thể chiếm phiên của bo khác.
authentication = [
  {
    mechanism = password_based
    backend = postgresql
    enable = true
    server = "postgres:5432"
    database = "sslos"
    username = "emqx_auth"
    password = "set-by-env"
    pool_size = 4
    password_hash_algorithm {
      name = sha256
      salt_position = prefix
    }
    query = "SELECT password_hash, salt, is_superuser FROM mqtt_accounts WHERE username = ${username} AND enabled AND (is_superuser OR username = ${clientid}) LIMIT 1"
  }
]

## Phân quyền topic: docker/emqx/acl.conf. Không khớp luật nào thì từ chối và ngắt kết nối.
authorization {
  no_match = deny
  deny_action = disconnect
  cache.enable = true
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

mqtt {
  max_packet_size = 16KB
}
